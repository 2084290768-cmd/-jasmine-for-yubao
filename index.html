<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>给宇宝的茉莉花</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07110c}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:manipulation}.ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-align:center}.title{position:absolute;top:8%;left:0;width:100%;opacity:0;transition:opacity 2s ease}.title.show{opacity:1}h1{margin:0;font-size:clamp(28px,7vw,50px);font-weight:400;letter-spacing:.16em;text-shadow:0 2px 18px #000}p{margin:14px 0 0;font-size:clamp(15px,4vw,21px);letter-spacing:.18em;opacity:.9}.tip{position:absolute;bottom:7%;width:100%;font-size:12px;letter-spacing:.16em;opacity:.55;transition:opacity 1s}.tip.hide{opacity:0}</style></head><body><canvas id="c"></canvas><div class="ui"><div class="title" id="title"><h1>给宇宝的茉莉花</h1><p>送君茉莉，愿君莫离</p></div><div class="tip" id="tip">轻触屏幕，让茉莉慢慢盛开</div></div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,t=0,started=false,progress=0,P=[],F=[],L=[],pet=[];const R=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);make()}function make(){P=[];F=[];L=[];const s=Math.min(W/430,H/850),cx=W/2,cy=H*.48;for(let i=0;i<1700;i++){let a=R(0,TAU),q=Math.pow(Math.random(),.52),rx=W*.24*(.35+.65*q),ry=H*.29*(.35+.65*q);P.push({x:R(0,W),y:R(0,H),tx:cx+Math.cos(a)*rx,ty:cy-H*.02+Math.sin(a)*ry,vx:R(-.12,.12),vy:R(-.08,.08),z:R(.35,1.25)*s,p:R(0,TAU),c:Math.random()})}for(let i=0;i<38;i++){let a=R(0,TAU),q=Math.sqrt(Math.random());F.push({x:cx+Math.cos(a)*W*.23*q,y:cy-H*.08+Math.sin(a)*H*.25*q,r:R(7,15)*s,p:R(0,TAU),d:R(.12,.68)})}for(let i=0;i<36;i++)L.push({x:cx+R(-W*.24,W*.24),y:H*.5+R(0,H*.29),s:R(.55,1.1)*s,r:R(-1.1,1.1),p:R(0,TAU)})}function start(){if(started)return;started=true;document.getElementById('tip').classList.add('hide');setTimeout(()=>document.getElementById('title').classList.add('show'),1800)}function leaf(o,a){x.save();x.translate(o.x,o.y);x.rotate(o.r+.035*Math.sin(t*.0015+o.p));x.scale(o.s,o.s);x.globalAlpha=.82*a;x.beginPath();x.moveTo(0,0);x.bezierCurveTo(18,-18,37,-15,45,0);x.bezierCurveTo(34,15,14,19,0,0);let g=x.createLinearGradient(0,-18,40,10);g.addColorStop(0,'#9bb18a');g.addColorStop(.45,'#557858');g.addColorStop(1,'#203e2a');x.fillStyle=g;x.fill();x.strokeStyle='rgba(210,235,200,.24)';x.lineWidth=.8;x.beginPath();x.moveTo(2,0);x.quadraticCurveTo(22,0,42,0);x.stroke();x.restore()}function flower(f,a){let q=Math.max(0,Math.min(1,(progress-f.d)/.35));if(!q)return;let xx=f.x+Math.sin(t*.0014+f.p)*2.5,yy=f.y;x.save();x.translate(xx,yy);x.globalAlpha=a*q;for(let k=0;k<5;k++){x.save();x.rotate(k*TAU/5);x.beginPath();x.moveTo(0,0);x.bezierCurveTo(f.r*.3,-f.r*.9,f.r*1.15,-f.r*.78,f.r*1.02,-f.r*.1);x.bezierCurveTo(f.r*.9,f.r*.48,f.r*.25,f.r*.65,0,0);let g=x.createRadialGradient(0,-f.r*.25,1,0,0,f.r);g.addColorStop(0,'#fff');g.addColorStop(.7,'#f3f7ef');g.addColorStop(1,'#cbd8c8');x.fillStyle=g;x.fill();x.restore()}x.beginPath();x.arc(0,0,f.r*.19,0,TAU);x.fillStyle='#d9c476';x.fill();x.restore()}function burst(){for(let i=0;i<70;i++)pet.push({x:W*.5+R(-W*.24,W*.24),y:H*.4+R(-H*.1,H*.2),vx:R(-.8,.8),vy:R(-1.5,-.2),r:R(0,TAU),vr:R(-.05,.05),life:R(90,170),max:0,s:R(.5,1)});pet.forEach(p=>p.max=p.life)}function frame(){t++;x.fillStyle='rgba(4,10,7,.18)';x.fillRect(0,0,W,H);if(!started)progress=Math.max(0,progress-.002);else progress=Math.min(1,progress+.006);P.forEach(p=>{if(started){let e=Math.min(1,progress*1.35);p.x+=(p.tx-p.x)*.018*e+p.vx+Math.sin(t*.001+p.p)*.025;p.y+=(p.ty-p.y)*.018*e+p.vy}else{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0}x.globalAlpha=(started?.7:.27)*(.5+.5*Math.sin(t*.003+p.p));x.fillStyle=p.c>.86?'#e5d5ad':p.c>.45?'#dbe8d5':'#fff';x.beginPath();x.arc(p.x,p.y,p.z,0,TAU);x.fill()});x.globalAlpha=1;let a=Math.max(0,Math.min(1,(progress-.38)/.45));if(a){x.lineCap='round';for(let i=0;i<24;i++){let xx=W*.5+R(-W*.19,W*.19),top=H*.39+R(-H*.02,H*.23);x.beginPath();x.moveTo(W*.5+R(-8,8),H*.9);x.quadraticCurveTo(W*.5+R(-W*.18,W*.18),H*.67,xx,top);x.strokeStyle='rgba(69,111,67,.72)';x.lineWidth=R(1.2,2.4);x.stroke()}L.forEach(l=>leaf(l,a));F.forEach(f=>flower(f,a))}pet=pet.filter(p=>p.life>0);pet.forEach(p=>{p.x+=p.vx+Math.sin(t*.002+p.r)*.3;p.y+=p.vy;p.vy+=.012;p.r+=p.vr;p.life--;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=.65*p.life/p.max;x.fillStyle='#fff';x.beginPath();x.ellipse(0,0,3.5,7,0,0,TAU);x.fill();x.restore()});requestAnimationFrame(frame)}c.addEventListener('pointerup',()=>{start();burst()});addEventListener('resize',resize);resize();x.fillStyle='#07110c';x.fillRect(0,0,W,H);requestAnimationFrame(frame)})();</script></body></html>
