<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realistic Jasmine Particle Bouquet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(()=>{"use strict";
const C=document.getElementById("scene"),ctx=C.getContext("2d",{alpha:false});
let W=innerWidth,H=innerHeight,D=Math.min(2,devicePixelRatio||1);
const state={rx:0,ry:0,auto:true,zoom:1,drag:false,lastX:0,lastY:0};
function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);C.width=W*D;C.height=H*D;C.style.width=W+"px";C.style.height=H+"px";ctx.setTransform(D,0,0,D,0,0)}
addEventListener("resize",resize);resize();

const TAU=Math.PI*2,R=Math.random;
const G=()=>{let a=0,b=0;while(!a)a=R();while(!b)b=R();return Math.sqrt(-2*Math.log(a))*Math.cos(TAU*b)};

const code=[
"import numpy as np","from particle_render import JasmineBouquet","",
"FPS = 60","FLOW = 0.012","PETAL_DETAIL = 0.92","LEAF_DETAIL = 0.88","",
"class BouquetSimulation:","    def update(self, dt):","        self.rotate(dt * 0.20)","        self.drift_particles(dt)","        self.relax_stems(dt)","",
"def blossom(center, scale):","    petals = five_petal_corolla(center, scale)","    center = soft_stamen_field(center)","    return petals + center","",
"bouquet = BouquetSimulation()","while running:","    bouquet.update(1/FPS)","    draw_botanical_structure()","    draw_particle_residue()","    draw_scientific_frame()","    present()","",
"# realistic white jasmine"," # natural green foliage"," # sparse particle breakup"
];

function P(x,y,z,rot){
 const cy=Math.cos(rot),sy=Math.sin(rot),cx=Math.cos(state.ry),sx=Math.sin(state.ry);
 let X=x*cy-z*sy, Z=x*sy+z*cy;
 let Y=y*cx-Z*sx; Z=y*sx+Z*cx;
 const per=1/(1.34-Z*.34),scale=Math.min(W,H)*.98*state.zoom;
 return {x:W*.72+X*scale*per,y:H*.50-Y*scale*per,z:Z,s:per};
}

/* -------- realistic flowers --------
   Each flower has 5 broad, overlapping, slightly cupped petals.
   The particles are sampled from petal surfaces rather than drawing a symbol.
*/
const flowerCenters=[
[-.22,.22,.02,.95],[-.09,.27,.08,.91],[.045,.24,-.02,.98],[.17,.20,.04,.94],
[-.30,.105,-.05,.90],[-.15,.12,.10,1.00],[-.01,.115,-.025,.94],[.145,.10,.06,.91],
[-.25,-.005,.025,.92],[-.085,-.025,-.05,.98],[.065,-.005,.03,.90]
];

const flowers=[], petalParticles=[];
function makeFlower(cx,cy,cz,s,seed){
 const local=[];
 // broad cupped petals; front/back curvature creates depth
 for(let k=0;k<5;k++){
   const a0=TAU*k/5+seed*.09;
   for(let i=0;i<105;i++){
     const u=R();                       // radial position
     const v=(R()-.5);                  // width across petal
     const r=.012+.074*Math.sqrt(u);
     const width=.034*Math.sin(Math.PI*Math.sqrt(u))*(.92+.15*R());
     const ang=a0 + v*(.82*(.55+.45*u));
     const px=Math.cos(ang)*r + Math.cos(a0+Math.PI/2)*width*v;
     const py=Math.sin(ang)*r*.83 + Math.sin(a0+Math.PI/2)*width*v;
     // petals cup backward at the outer edge
     const pz=.035 + .052*Math.pow(u,1.55) + .018*Math.sin(Math.PI*u) + G()*.004;
     local.push({x:cx+px*s,y:cy+py*s,z:cz+pz*s,
       r:.45+R()*.85,a:.30+R()*.38,ph:R()*TAU,kind:"petal"});
   }
 }
 // central yellow-green stamen field: sparse, not a yellow disk
 for(let i=0;i<48;i++){
   const a=R()*TAU,r=Math.sqrt(R())*.025*s;
   local.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r*.75,
     z:cz+.072*s+G()*.009,r:.38+R()*.7,a:.28+R()*.30,ph:R()*TAU,kind:"stamen"});
 }
 flowers.push(local);petalParticles.push(...local);
}
flowerCenters.forEach(f=>makeFlower(...f));

/* natural stems with slight individual curvature */
const stems=[];
const stemTips=flowerCenters.map(f=>f.slice(0,3));
const bases=[
[-.18,-.43,.03],[-.13,-.44,.01],[-.08,-.46,.04],[-.01,-.45,.00],
[.06,-.44,.02],[.11,-.45,-.02],[.16,-.43,.02],[.20,-.42,-.02],
[-.01,-.46,-.04],[.06,-.44,.05],[.12,-.45,.00]
];
for(let i=0;i<11;i++){
 const b=bases[i],t=stemTips[i];
 for(let j=0;j<85;j++){
   const u=j/84;
   const bend=Math.sin(Math.PI*u)*(0.018+((i*7)%5)*.004);
   const nx=-(t[1]-b[1]),ny=(t[0]-b[0]);const nl=Math.hypot(nx,ny)||1;
   const side=bend*(i%2?-1:1);
   stems.push({x:b[0]*(1-u)+t[0]*u+nx/nl*side,
     y:b[1]*(1-u)+t[1]*u+ny/nl*side,
     z:b[2]*(1-u)+t[2]*u+Math.sin(u*5+i)*.006,
     r:.42+R()*.58,a:.28+R()*.28,ph:R()*TAU});
 }
}

/* broad lanceolate leaves with midrib-like central particle line */
const leaves=[];
const leafSpecs=[
[-.19,-.22,.01,-.39,-.06,.00,.18],[-.12,-.25,.02,-.30,-.09,.03,.15],
[-.04,-.25,.00,.19,-.08,.02,.18],[.08,-.23,.02,.33,-.03,.00,.17],
[-.18,-.12,.03,-.40,.03,.01,.16],[-.02,-.12,-.01,.25,.08,.02,.18],
[.11,-.10,.01,.37,.09,.01,.16],[-.12,.00,.00,-.30,.15,.03,.17],
[.04,-.02,.02,.29,.19,.01,.18]
];
function leaf(q,idx){
 const [bx,by,bz,tx,ty,tz,w]=q,dx=tx-bx,dy=ty-by,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
 for(let i=0;i<85;i++){
   const u=i/84;
   const width=Math.sin(Math.PI*u)*w*(.92+.12*R());
   const side=(R()-.5)*2;
   leaves.push({x:bx+dx*u+nx*width*side,y:by+dy*u+ny*width*side,
     z:bz+(tz-bz)*u+G()*.006,r:.35+R()*.72,a:.24+R()*.30,ph:R()*TAU});
 }
 // brighter central vein
 for(let i=0;i<30;i++){
   const u=i/29;
   leaves.push({x:bx+dx*u,y:by+dy*u,z:bz+(tz-bz)*u+.004,r:.35+R()*.35,a:.25+R()*.18,ph:R()*TAU});
 }
}
leafSpecs.forEach(leaf);

/* detached residue, mostly around outer petals */
const dust=[];
for(let i=0;i<760;i++){
 const f=flowerCenters[(R()*flowerCenters.length)|0],a=R()*TAU,r=.09+Math.pow(R(),.55)*.34;
 dust.push({x:f[0]+Math.cos(a)*r,y:f[1]+Math.sin(a)*r*.78,z:f[2]+G()*.13,
   vx:G()*.0055,vy:G()*.004,vz:G()*.004,r:.25+R()*.8,a:.055+R()*.19,ph:R()*TAU,
   green:R()<.14});
}

function background(t){
 ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
 ctx.fillStyle="rgba(3,4,6,.86)";ctx.fillRect(0,0,W*.49,H);
 const fs=Math.max(9,Math.min(13,W/105)),lh=fs*1.65;
 ctx.font=fs+"px ui-monospace,SFMono-Regular,Menlo,monospace";
 const sc=(t*lh*3.0)%(code.length*lh);
 for(let rep=-1;rep<2;rep++)code.forEach((s,i)=>{
   const y=42+i*lh-sc+rep*code.length*lh;if(y<18||y>H-20)return;
   ctx.fillStyle="rgba(180,188,198,.25)";ctx.fillText(String(i+1).padStart(2,"0"),16,y);
   let col="rgba(226,231,236,.53)";
   if(s.trim().startsWith("#"))col="rgba(155,185,170,.34)";
   if(/class |def |while |import |from /.test(s))col="rgba(220,215,245,.65)";
   ctx.fillStyle=col;ctx.fillText(s,50,y);
 });
 ctx.font="10px ui-monospace,monospace";ctx.fillStyle="rgba(240,245,248,.34)";
 ctx.fillText("● RUNNING   realistic_jasmine_particles.py",16,H-18);
}

function frame(rot){
 const v=[];
 for(const X of [-.47,.47])for(const Y of [-.48,.48])for(const Z of [-.34,.34])v.push(P(X,Y,Z,rot));
 const edges=[[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
 edges.forEach(e=>{ctx.beginPath();ctx.moveTo(v[e[0]].x,v[e[0]].y);ctx.lineTo(v[e[1]].x,v[e[1]].y);ctx.strokeStyle="rgba(240,244,248,.10)";ctx.lineWidth=.55;ctx.stroke()});
}

C.addEventListener("pointerdown",e=>{
 state.drag=true;state.lastX=e.clientX;state.lastY=e.clientY;C.setPointerCapture(e.pointerId);
});
C.addEventListener("pointermove",e=>{
 if(!state.drag)return;
 const dx=e.clientX-state.lastX,dy=e.clientY-state.lastY;
 state.lastX=e.clientX;state.lastY=e.clientY;
 state.rx+=dx*.008;state.ry=Math.max(-1.05,Math.min(1.05,state.ry+dy*.008));
});
C.addEventListener("pointerup",()=>state.drag=false);
C.addEventListener("pointercancel",()=>state.drag=false);
C.addEventListener("wheel",e=>{
 e.preventDefault();
 state.zoom=Math.max(.72,Math.min(1.55,state.zoom*Math.exp(-e.deltaY*.0008)));
},{passive:false});
C.addEventListener("dblclick",()=>{state.rx=0;state.ry=0;state.zoom=1;});
function render(t){
 background(t);
 // Slow automatic orbit continues when the user is not dragging.
 if(state.auto && !state.drag) state.rx+=0.0022;

 // Continuous rotation. Drag horizontally/vertically to orbit; wheel/pinch changes zoom.
 const rotX=state.rx, rotY=state.ry;
 frame(rotX);

 // soft volume light behind the real bouquet
 const gl=ctx.createRadialGradient(W*.72,H*.46,0,W*.72,H*.46,Math.min(W,H)*.42);
 gl.addColorStop(0,"rgba(255,248,250,.045)");gl.addColorStop(1,"rgba(0,0,0,0)");
 ctx.fillStyle=gl;ctx.fillRect(W*.49,0,W*.51,H);

 // botanical base: stems/leaves are visible and colored.
 const green=[];
 stems.forEach(p=>green.push({p,q:P(p.x,p.y,p.z,rot),leaf:false}));
 leaves.forEach(p=>green.push({p,q:P(p.x,p.y,p.z,rot),leaf:true}));
 green.sort((a,b)=>a.q.z-b.q.z);
 green.forEach(o=>{
   const r=Math.max(.42,o.p.r*o.q.s);
   ctx.beginPath();ctx.arc(o.q.x,o.q.y,r,0,TAU);
   ctx.fillStyle=o.leaf
     ?"rgba(108,170,106,"+o.p.a+")"
     :"rgba(58,125,66,"+o.p.a+")";
   ctx.fill();
 });

 // white flowers over the foliage
 const white=[];
 petalParticles.forEach(p=>{
   const q=P(p.x+Math.sin(t*1.3+p.ph)*.0018,p.y+Math.cos(t*1.15+p.ph)*.0018,
             p.z+Math.sin(t+p.ph)*.002,rot);
   white.push({p,q});
 });
 dust.forEach(p=>{
   const q=P(p.x+p.vx*t,p.y+p.vy*t,p.z+p.vz*t,rot);
   white.push({p,q,dust:true});
 });
 white.sort((a,b)=>a.q.z-b.q.z);
 white.forEach(o=>{
   const r=Math.max(.38,o.p.r*o.q.s*.80);
   ctx.beginPath();ctx.arc(o.q.x,o.q.y,r,0,TAU);
   let alpha=o.p.a*(.84+.16*Math.sin(t*1.5+o.p.ph));
   if(o.p.kind==="stamen")ctx.fillStyle="rgba(220,222,178,"+alpha+")";
   else if(o.p.green)ctx.fillStyle="rgba(130,180,120,"+alpha+")";
   else ctx.fillStyle="rgba(251,246,249,"+alpha+")";
   ctx.fill();
 });

 // faint outward fragments
 for(let i=0;i<65;i++){
   const p=dust[(i*13)%dust.length],q=P(p.x,p.y,p.z,rot),q2=P(p.x*1.045,p.y*1.045,p.z,rot);
   ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q2.x,q2.y);
   ctx.strokeStyle="rgba(245,240,245,.025)";ctx.lineWidth=.5;ctx.stroke();
 }
 requestAnimationFrame(()=>render((performance.now()/1000)%5));
}
render(0);
})();
</script>
</body>
</html>
