<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>11 Jasmine Particle Bouquet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{"use strict";
const c=document.getElementById("c"),x=c.getContext("2d",{alpha:false});
let W,H,S;
function size(){W=innerWidth;H=innerHeight;S=Math.min(2,devicePixelRatio||1);c.width=W*S;c.height=H*S;c.style.width=W+"px";c.style.height=H+"px";x.setTransform(S,0,0,S,0,0)}
addEventListener("resize",size);size();

const TAU=Math.PI*2,R=Math.random;
const G=()=>{let a=0,b=0;while(!a)a=R();while(!b)b=R();return Math.sqrt(-2*Math.log(a))*Math.cos(TAU*b)};
const code=[
"import numpy as np","from jasmine_particles import Bouquet","",
"FPS = 60","FLOW = 0.016","DENSITY = 0.14","BLOOM = 11","",
"class JasmineBouquet:","    def update(self, dt):","        self.rotate(dt * 0.22)","        self.advect(dt)","        self.reseed_edges()","",
"def jasmine_petal(theta, radius):","    curl = np.sin(theta * 2.5)","    return radius + curl * 0.012","",
"bouquet = JasmineBouquet()","while running:","    bouquet.update(1 / FPS)","    draw_stems_and_leaves()","    draw_particle_blossoms()","    draw_wireframe()","    present()","",
"# five-petal white blossoms","# green stems / leaves","# sparse volumetric particles"
];

function project(px,py,pz,rot){
 const ca=Math.cos(rot),sa=Math.sin(rot);
 const X=px*ca-pz*sa, Z=px*sa+pz*ca;
 const p=1/(1.32-Z*.38), scale=Math.min(W,H)*.94;
 return {X:W*.72+X*scale*p,Y:H*.48-py*scale*p,Z,s:p};
}

/* --- Explicit botanical structure --- */
const flowers=[];
const flowerPos=[
[-.23,.22,.03],[-.10,.26,.08],[.04,.23,-.02],[.17,.19,.04],
[-.31,.10,-.05],[-.17,.11,.10],[-.02,.10,-.03],[.14,.08,.06],
[-.25,-.01,.02],[-.09,-.03,-.05],[.06,-.01,.03]
];
const stemBase=[
[-.22,-.45,.02],[-.16,-.45,.03],[-.08,-.46,.01],[.00,-.44,.03],
[.08,-.43,.01],[.16,-.44,.02],[.22,-.42,.00],
[-.03,-.44,-.04],[.04,-.43,.04],[.12,-.43,-.02],[-.12,-.44,-.03]
];

function blossom(cx,cy,cz,scale,seed){
 let a=[];
 // Five unmistakable jasmine petals, each a broad curved ribbon of particles.
 for(let pet=0;pet<5;pet++){
   const base=TAU*pet/5+seed*.12;
   for(let j=0;j<46;j++){
     const u=j/45;
     const rr=(.018+.073*Math.sin(Math.PI*u))*scale;
     const ang=base+(u-.5)*.82;
     const dome=.018*Math.sin(Math.PI*u)*scale;
     a.push({
       x:cx+Math.cos(ang)*rr,
       y:cy+Math.sin(ang)*rr*.82+dome*.16,
       z:cz+dome+G()*.006,
       r:.65+R()*1.15,
       al:.38+R()*.42,
       ph:R()*TAU,
       type:"petal"
     });
   }
 }
 // inner white petals
 for(let j=0;j<38;j++){
   const ang=R()*TAU,rr=Math.sqrt(R())*.035*scale;
   a.push({x:cx+Math.cos(ang)*rr,y:cy+Math.sin(ang)*rr*.78,z:cz+.025+G()*.012,r:.7+R(),al:.45+R()*.3,ph:R()*TAU,type:"center"});
 }
 return a;
}
for(let i=0;i<11;i++) flowers.push(blossom(...flowerPos[i],.95+(i%3)*.03,i));

/* curved green stems: intentionally visible */
const stems=[];
function stem(base,tip,seed){
 for(let j=0;j<34;j++){
   const u=j/33;
   const bend=Math.sin(u*Math.PI)*(.035+(seed%3)*.008);
   stems.push({
     x:base[0]*(1-u)+tip[0]*u+bend,
     y:base[1]*(1-u)+tip[1]*u,
     z:base[2]*(1-u)+tip[2]*u+Math.sin(u*4+seed)*.006,
     r:.65+R()*.8, al:.32+R()*.35, ph:R()*TAU
   });
 }
}
flowerPos.forEach((tip,i)=>stem(stemBase[i],tip,i));

/* clearly recognizable elongated leaves */
const leaves=[];
const leafSpecs=[
[-.20,-.22,.00,-.36,-.05,.00,.18],[-.08,-.25,.02,-.27,-.08,.02,.16],
[.02,-.22,.02,.22,-.05,.01,.17],[.13,-.20,.02,.30,-.02,.00,.18],
[-.19,-.08,.04,-.39,.06,.02,.16],[.02,-.08,-.02,.23,.09,.03,.17],
[.12,-.05,.01,.34,.10,.02,.15],[-.10,.02,.00,-.28,.17,.02,.16],
[.08,.02,.01,.28,.18,.01,.17]
];
for(const q of leafSpecs){
 const [bx,by,bz,tx,ty,tz,w]=q;
 for(let j=0;j<38;j++){
   const u=j/37;
   const centerX=bx+(tx-bx)*u, centerY=by+(ty-by)*u,centerZ=bz+(tz-bz)*u;
   const width=Math.sin(Math.PI*u)*w;
   // perpendicular in xy plane
   const dx=tx-bx,dy=ty-by,L=Math.hypot(dx,dy)||1;
   const nx=-dy/L,ny=dx/L;
   const side=(R()-.5)*2;
   leaves.push({
     x:centerX+nx*width*side,y:centerY+ny*width*side,
     z:centerZ+G()*.008,r:.48+R()*.8,al:.20+R()*.28,ph:R()*TAU
   });
 }
}

/* loose white and green dust */
const dust=[];
for(let i=0;i<620;i++){
 const f=flowerPos[(R()*11)|0],a=R()*TAU,rr=.10+Math.pow(R(),.65)*.32;
 dust.push({x:f[0]+Math.cos(a)*rr,y:f[1]+Math.sin(a)*rr*.72,z:f[2]+G()*.12,
 vx:G()*.006,vy:G()*.004,vz:G()*.004,r:.3+R()*.9,al:.06+R()*.22,ph:R()*TAU,green:R()<.18});
}

function codeBg(t){
 x.fillStyle="#000";x.fillRect(0,0,W,H);
 x.fillStyle="rgba(3,4,6,.86)";x.fillRect(0,0,W*.49,H);
 const fs=Math.max(9,Math.min(13,W/105)),lh=fs*1.65;
 x.font=fs+"px ui-monospace,SFMono-Regular,Menlo,monospace";
 const scroll=(t*lh*3.1)%(code.length*lh);
 for(let rep=-1;rep<2;rep++)code.forEach((s,i)=>{
   const y=42+i*lh-scroll+rep*code.length*lh;if(y<18||y>H-20)return;
   x.fillStyle="rgba(180,188,198,.27)";x.fillText(String(i+1).padStart(2,"0"),16,y);
   let col="rgba(226,231,236,.54)";
   if(s.startsWith("#"))col="rgba(160,190,175,.38)";
   else if(/class |def |while |import |from /.test(s))col="rgba(220,215,245,.66)";
   x.fillStyle=col;x.fillText(s,50,y);
 });
 x.font="10px ui-monospace,monospace";x.fillStyle="rgba(240,245,248,.34)";
 x.fillText("● RUNNING   jasmine_particle_sim.py",16,H-18);
}

function wire(rot){
 const v=[];
 for(const X of [-.47,.47])for(const Y of [-.48,.48])for(const Z of [-.34,.34])v.push(project(X,Y,Z,rot));
 const e=[[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
 e.forEach(q=>{x.beginPath();x.moveTo(v[q[0]].X,v[q[0]].Y);x.lineTo(v[q[1]].X,v[q[1]].Y);x.strokeStyle="rgba(240,244,248,.11)";x.lineWidth=.55;x.stroke()});
}

function render(t){
 codeBg(t);
 const phase=(t%5)/5,rot=phase*TAU*.075;
 wire(rot);

 // Render stems and leaves first so flowers sit visually on top.
 const botanical=[];
 stems.forEach(p=>{const q=project(p.x,p.y,p.z,rot);botanical.push({q,p,col:"greenStem"})});
 leaves.forEach(p=>{const q=project(p.x,p.y,p.z,rot);botanical.push({q,p,col:"leaf"})});
 botanical.sort((a,b)=>a.q.Z-b.q.Z);
 botanical.forEach(o=>{
   const rr=Math.max(.42,o.p.r*o.q.s);
   x.beginPath();x.arc(o.q.X,o.q.Y,rr,0,TAU);
   x.fillStyle=o.col==="leaf"
    ?"rgba(125,185,126,"+o.p.al*(.8+.2*Math.sin(t+o.p.ph))+")"
    :"rgba(74,142,82,"+o.p.al+")";
   x.fill();
 });

 const particles=[];
 flowers.flat().forEach(p=>{
   const q=project(p.x+Math.sin(t*1.4+p.ph)*.002,p.y+Math.cos(t*1.2+p.ph)*.002,p.z+Math.sin(t+p.ph)*.002,rot);
   particles.push({q,p,green:false});
 });
 dust.forEach(p=>{
   const q=project(p.x+p.vx*t,p.y+p.vy*t,p.z+p.vz*t,rot);
   particles.push({q,p,green:p.green});
 });
 particles.sort((a,b)=>a.q.Z-b.q.Z);
 particles.forEach(o=>{
   const rr=Math.max(.38,o.p.r*o.q.s*.78);
   x.beginPath();x.arc(o.q.X,o.q.Y,rr,0,TAU);
   x.fillStyle=o.green
    ?"rgba(145,195,145,"+o.p.al+")"
    :"rgba(250,244,248,"+o.p.al+")";
   x.fill();
 });

 // a few faint particle trails
 for(let i=0;i<55;i++){
   const p=dust[(i*11)%dust.length],q=project(p.x,p.y,p.z,rot),q2=project(p.x*1.045,p.y*1.045,p.z,rot);
   x.beginPath();x.moveTo(q.X,q.Y);x.lineTo(q2.X,q2.Y);
   x.strokeStyle="rgba(240,242,245,.025)";x.lineWidth=.5;x.stroke();
 }
 requestAnimationFrame(()=>render((performance.now()/1000)%5));
}
render(0);
})();
</script>
</body>
</html>
