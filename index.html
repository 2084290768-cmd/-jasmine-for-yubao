<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>三维粒子茉莉花束</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a}canvas{display:block;width:100%;height:100%;touch-action:none}.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 14px;border:1px solid rgba(210,240,255,.16);border-radius:999px;background:rgba(2,7,13,.5);backdrop-filter:blur(10px);color:rgba(235,248,255,.76);font:12px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;letter-spacing:.08em;white-space:nowrap}</style></head>
<body><canvas id="c"></canvas><div class="hint">三维粒子茉莉花束 · 自动旋转 · 拖动查看</div>
<script>
'use strict';
const canvas=document.getElementById('c'),gl=canvas.getContext('webgl',{antialias:true,alpha:false,powerPreference:'high-performance'});
if(!gl){document.body.innerHTML='<div style="color:white;padding:30px;font:18px sans-serif">你的浏览器不支持 WebGL。</div>';throw Error('WebGL unavailable');}
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const vs=shader(gl.VERTEX_SHADER,`attribute vec3 aPos;attribute vec3 aNor;uniform mat4 uProj,uView,uModel;varying vec3 vN,vP;void main(){vec4 p=uModel*vec4(aPos,1.0);vP=p.xyz;vN=mat3(uModel)*aNor;gl_Position=uProj*uView*p;}`);
const fs=shader(gl.FRAGMENT_SHADER,`precision mediump float;varying vec3 vN,vP;uniform vec3 uColor;void main(){vec3 n=normalize(vN);vec3 l=normalize(vec3(-.35,.9,.65));vec3 l2=normalize(vec3(.8,.1,.7));float d=max(dot(n,l),0.0);float d2=max(dot(n,l2),0.0);float edge=pow(1.0-max(dot(n,normalize(-vP)),0.0),2.0);vec3 col=uColor*(.28+.72*d)+uColor*.22*d2+vec3(.18,.28,.36)*edge*.5;gl_FragColor=vec4(col,1.0);}`);
const prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
const loc={pos:gl.getAttribLocation(prog,'aPos'),nor:gl.getAttribLocation(prog,'aNor'),proj:gl.getUniformLocation(prog,'uProj'),view:gl.getUniformLocation(prog,'uView'),model:gl.getUniformLocation(prog,'uModel'),color:gl.getUniformLocation(prog,'uColor')};
function mat4Perspective(fovy,asp,n,f){let t=1/Math.tan(fovy/2),o=new Float32Array(16);o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o}
function mat4View(z){let o=new Float32Array(16);o[0]=o[5]=o[10]=1;o[14]=-z;o[15]=1;return o}
function rotY(a){let c=Math.cos(a),s=Math.sin(a),o=new Float32Array(16);o[0]=c;o[2]=s;o[5]=1;o[8]=-s;o[10]=c;o[15]=1;return o}
function rotX(a){let c=Math.cos(a),s=Math.sin(a),o=new Float32Array(16);o[0]=1;o[5]=c;o[6]=s;o[9]=-s;o[10]=c;o[15]=1;return o}
function mul(a,b){let o=new Float32Array(16);for(let r=0;r<4;r++)for(let c=0;c<4;c++)o[c+r*4]=a[r*4]*b[c]+a[r*4+1]*b[c+4]+a[r*4+2]*b[c+8]+a[r*4+3]*b[c+12];return o}
function meshData(){let P=[],N=[];function flower(cx,cy,cz,scale,tilt){for(let k=0;k<6;k++){let ang=k*Math.PI/3+tilt;let seg=10,ac=5,base=P.length/3;for(let i=0;i<=seg;i++){let t=i/seg;let y=t*1.28*scale;let width=Math.sin(Math.PI*Math.pow(t,.82))*.62*scale*(1-.13*t);let cup=.20*Math.sin(Math.PI*t)*scale;for(let j=0;j<=ac;j++){let u=j/ac,x=(u-.5)*2*width;let z=cup*(1-2*Math.abs(u-.5));let bend=.22*t*t*scale;let xx=x,yy=y+bend,zz=z;let ca=Math.cos(ang),sa=Math.sin(ang);let wx=cx+xx*ca-zz*sa,wy=cy+yy,wz=cz+xx*sa+zz*ca;P.push(wx,wy,wz);let nx=Math.sin(Math.PI*t)*.22*Math.cos(ang),ny=.35,nz=Math.sin(Math.PI*t)*.22*Math.sin(ang);N.push(nx,ny,nz);}}for(let i=0;i<seg;i++)for(let j=0;j<ac;j++){let a=base+i*(ac+1)+j,b=a+1,c=a+(ac+1),d=c+1;idx.push(a,c,b,b,c,d);}}}let idx=[];
flower(0,1.25,.1,1.18,.1);flower(-1.55,.48,.25,.86,.4);flower(1.52,.5,.2,.9,-.3);flower(-1.12,-.85,-.1,.82,.8);flower(1.12,-.92,-.2,.84,-.8);flower(0,-.48,-.55,.9,.15);flower(0,1.95,-.45,.68,-.2);
return {p:new Float32Array(P),n:new Float32Array(N),i:new Uint32Array(idx)};}
const d=meshData();
const bp=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bp);gl.bufferData(gl.ARRAY_BUFFER,d.p,gl.STATIC_DRAW);const bn=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bn);gl.bufferData(gl.ARRAY_BUFFER,d.n,gl.STATIC_DRAW);const bi=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bi);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,d.i,gl.STATIC_DRAW);
// stems as simple 3D tubes approximated by connected rings
let sp=[],sn=[],si=[];function stem(tx,ty,tz){let steps=14,rad=.045,base=sp.length/3;for(let i=0;i<=steps;i++){let t=i/steps,y=-2.5+(ty+2.35)*t,x=tx*t*.92,z=tz*t*.92;for(let j=0;j<6;j++){let a=j*Math.PI/3;sp.push(x+rad*Math.cos(a),y,z+rad*Math.sin(a));sn.push(Math.cos(a),0,Math.sin(a));}}for(let i=0;i<steps;i++)for(let j=0;j<6;j++){let a=base+i*6+j,b=base+i*6+(j+1)%6,c=base+(i+1)*6+j,e=base+(i+1)*6+(j+1)%6;si.push(a,c,b,b,c,e);}}[[0,1.25,.1],[-1.55,.48,.25],[1.52,.5,.2],[-1.12,-.85,-.1],[1.12,-.92,-.2],[0,-.48,-.55],[0,1.95,-.45]].forEach(s=>stem(s[0],s[1]-.22,s[2]));
const sbp=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,sbp);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(sp),gl.STATIC_DRAW);const sbn=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,sbn);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(sn),gl.STATIC_DRAW);const sbi=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,sbi);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(si),gl.STATIC_DRAW);
// particles
let pp=[];for(let i=0;i<1150;i++){let a=Math.random()*Math.PI*2,r=Math.pow(Math.random(),.6)*3.7;pp.push(Math.cos(a)*r*.72,(Math.random()-.38)*4.8,Math.sin(a)*r*.5);}
const pbuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,pbuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pp),gl.STATIC_DRAW);
const pvs=shader(gl.VERTEX_SHADER,`attribute vec3 aPos;uniform mat4 uProj,uView,uModel;void main(){gl_Position=uProj*uView*uModel*vec4(aPos,1.0);gl_PointSize=3.0;}`),pfs=shader(gl.FRAGMENT_SHADER,`precision mediump float;void main(){vec2 q=gl_PointCoord-.5;float a=smoothstep(.5,0.0,length(q));gl_FragColor=vec4(.55,.88,1.0,a*.8);}`);const ppgr=gl.createProgram();gl.attachShader(ppgr,pvs);gl.attachShader(ppgr,pfs);gl.linkProgram(ppgr);const pl={pos:gl.getAttribLocation(ppgr,'aPos'),proj:gl.getUniformLocation(ppgr,'uProj'),view:gl.getUniformLocation(ppgr,'uView'),model:gl.getUniformLocation(ppgr,'uModel')};
let yaw=0,pitch=.05,drag=false,lastX=0,lastY=0,auto=true;canvas.addEventListener('pointerdown',e=>{drag=true;auto=false;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lastX)*.006;pitch+=(e.clientY-lastY)*.004;pitch=Math.max(-.55,Math.min(.55,pitch));lastX=e.clientX;lastY=e.clientY});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
function resize(){let dpr=Math.min(devicePixelRatio||1,2),w=Math.floor(innerWidth*dpr),h=Math.floor(innerHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}}
function draw(){resize();if(auto&&!drag)yaw+=.0032;let proj=mat4Perspective(.65,canvas.width/canvas.height,.1,100),view=mat4View(10.5),model=mul(rotY(yaw),rotX(pitch));gl.enable(gl.DEPTH_TEST);gl.clearColor(.008,.018,.03,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
gl.useProgram(prog);gl.uniformMatrix4fv(loc.proj,false,proj);gl.uniformMatrix4fv(loc.view,false,view);gl.uniformMatrix4fv(loc.model,false,model);gl.uniform3f(loc.color,.94,.98,1.0);gl.bindBuffer(gl.ARRAY_BUFFER,bp);gl.enableVertexAttribArray(loc.pos);gl.vertexAttribPointer(loc.pos,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,bn);gl.enableVertexAttribArray(loc.nor);gl.vertexAttribPointer(loc.nor,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bi);gl.drawElements(gl.TRIANGLES,d.i.length,gl.UNSIGNED_INT,0);
gl.uniform3f(loc.color,.12,.27,.20);gl.bindBuffer(gl.ARRAY_BUFFER,sbp);gl.vertexAttribPointer(loc.pos,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,sbn);gl.vertexAttribPointer(loc.nor,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,sbi);gl.drawElements(gl.TRIANGLES,si.length,gl.UNSIGNED_INT,0);
gl.useProgram(ppgr);gl.uniformMatrix4fv(pl.proj,false,proj);gl.uniformMatrix4fv(pl.view,false,view);gl.uniformMatrix4fv(pl.model,false,model);gl.bindBuffer(gl.ARRAY_BUFFER,pbuf);gl.enableVertexAttribArray(pl.pos);gl.vertexAttribPointer(pl.pos,3,gl.FLOAT,false,0,0);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.depthMask(false);gl.drawArrays(gl.POINTS,0,pp.length/3);gl.depthMask(true);gl.disable(gl.BLEND);requestAnimationFrame(draw)}
requestAnimationFrame(draw);
</script></body></html>
