<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Particle Jasmine Bouquet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
canvas{display:block;width:100%;height:100%;background:#000}
#hint{position:fixed;left:14px;bottom:10px;color:rgba(255,255,255,.22);font:10px ui-monospace,monospace;letter-spacing:.04em;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">PYTHON PARTICLE SIMULATION • 5.0s LOOP</div>
<script>
(() => {
"use strict";
const canvas=document.getElementById("c"), ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=Math.min(2,devicePixelRatio||1);
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener("resize",resize); resize();

const TAU=Math.PI*2;
const code = [
"import numpy as np","from particle_solver import BouquetField","",
"FPS = 60","DURATION = 5.0","FLOW = 0.018","DENSITY = 0.13","",
"class JasmineField:","    def __init__(self, n=1800):","        self.n = n","        self.phase = 0.0","        self.drift = 0.0","",
"    def update(self, dt):","        self.phase += dt * 0.52","        self.rotate_y(dt * 0.22)","        self.advect_particles(dt)","        self.reseed_sparse_edges()","",
"def particle_kernel(p, t):","    x, y, z = p","    curl = np.sin(y*3.7 + t)","    return x + curl*0.002, y, z","",
"field = JasmineField()","while running:","    field.update(1/FPS)","    render_wireframe()","    render_particles()","    present()","",
"# low density / high air-space","# non-solid volumetric residue","# slow continuous rotation"
];

const rnd=(a=1)=>Math.random()*a;
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);};

let flowers=[], particles=[];
const flowerCenters=[
 [-.36,-.05,.02],[-.18,-.20,.10],[.02,-.17,-.05],[.21,-.08,.05],
 [-.43,.12,-.05],[-.22,.02,-.12],[.00,.06,.13],[.24,.13,-.10],
 [-.30,.25,.04],[-.06,.28,-.04],[.17,.29,.08]
];
function makeFlower(cx,cy,cz,scale,i){
  let pts=[];
  const rings=5;
  for(let r=0;r<rings;r++){
    const rad=(r+1)/rings;
    const count=16+r*7;
    for(let k=0;k<count;k++){
      const a=TAU*k/count + rnd(.16);
      const rr=(.025 + .105*rad)*(0.84+rnd(.28));
      const petalCurl=Math.sin(a*2.4+r*.7)*.018;
      pts.push({
        x:cx+Math.cos(a)*rr*scale,
        y:cy+Math.sin(a)*rr*scale*.72 + petalCurl,
        z:cz+(r-2)*.018 + gauss()*.018,
        size:.35+rnd(1.05),
        phase:rnd(TAU),
        alpha:.24+rnd(.42)
      });
    }
  }
  // sparse center particles
  for(let k=0;k<22;k++) pts.push({x:cx+gauss()*.025*scale,y:cy+gauss()*.018*scale,z:cz+gauss()*.02,size:.45+rnd(.8),phase:rnd(TAU),alpha:.3+rnd(.35)});
  flowers.push(pts);
}
flowerCenters.forEach((p,i)=>makeFlower(p[0],p[1],p[2],.82+rnd(.18),i));

// Additional broken/escaping particles around the bouquet
for(let i=0;i<850;i++){
  const f=flowerCenters[(Math.random()*flowerCenters.length)|0];
  const a=rnd(TAU), rad=.11+rnd(.32);
  particles.push({
    x:f[0]+Math.cos(a)*rad, y:f[1]+Math.sin(a)*rad*.72, z:f[2]+gauss()*.16,
    vx:gauss()*.018, vy:gauss()*.012, vz:gauss()*.012,
    size:.25+rnd(1.15), phase:rnd(TAU), alpha:.10+rnd(.28)
  });
}
function allPoints(){
  const a=[];
  for(const fl of flowers) for(const p of fl)a.push(p);
  for(const p of particles)a.push(p);
  return a;
}
const pts=allPoints();

function project(x,y,z,ang){
  const ca=Math.cos(ang),sa=Math.sin(ang);
  let X=x*ca-z*sa, Z=x*sa+z*ca;
  const persp=1/(1.18-Z*.72);
  const scale=Math.min(W,H)*.63;
  return {x:W*.69+X*scale*persp,y:H*.51-y*scale*persp,s:persp,z:Z};
}
function line(a,b,alpha=0.13){
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
  ctx.strokeStyle=`rgba(235,240,245,${alpha})`;ctx.lineWidth=.55;ctx.stroke();
}
function wireframe(ang,t){
  const cx=W*.69,cy=H*.51,s=Math.min(W,H)*.56;
  const q=[];
  for(const X of [-.5,.5])for(const Y of [-.5,.5])for(const Z of [-.5,.5])q.push(project(X*.75,Y*.75,Z*.55,ang));
  // indices in X,Y,Z loops
  const idx=(x,y,z)=>x*4+y*2+z;
  [[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]].forEach(e=>line(q[e[0]],q[e[1]],.105));
  // faint inner reference cuts
  for(let k=0;k<3;k++){
    const z=-.55+k*.55;
    const A=project(-.75,-.75,z*.55,ang),B=project(.75,-.75,z*.55,ang),C=project(.75,.75,z*.55,ang),D=project(-.75,.75,z*.55,ang);
    line(A,B,.045);line(B,C,.045);line(C,D,.045);line(D,A,.045);
  }
  // axes / scientific guide lines
  line(project(-.9,0,0,ang),project(.9,0,0,ang),.075);
  line(project(0,-.9,0,ang),project(0,.9,0,ang),.055);
}

function drawCode(scroll,t){
  ctx.save();
  const x=W*.035, top=H*.055, width=W*.43;
  ctx.fillStyle="rgba(0,0,0,.42)";
  ctx.fillRect(0,0,width,H);
  ctx.font=Math.max(8,Math.min(13,W/110))+"px ui-monospace,monospace";
  const lh=Math.max(14,Math.min(20,W/68));
  const offset=(t*lh*3.8)%(code.length*lh);
  for(let rep=-1;rep<2;rep++){
    for(let i=0;i<code.length;i++){
      const y=top+i*lh-offset+rep*code.length*lh;
      if(y<-20||y>H+20)continue;
      ctx.fillStyle="rgba(210,215,220,.30)";
      ctx.fillText(String(i+1).padStart(2,"0"),x,y);
      let txt=code[i], col="rgba(225,230,235,.48)";
      if(txt.includes("import")||txt.includes("from")) col="rgba(225,210,245,.55)";
      if(txt.includes("def")||txt.includes("class")||txt.includes("while")) col="rgba(215,230,255,.62)";
      if(txt.includes("#")) col="rgba(170,190,185,.34)";
      ctx.fillStyle=col;ctx.fillText(txt,x+34,y);
    }
  }
  // tiny running status
  ctx.font="9px ui-monospace,monospace";
  ctx.fillStyle="rgba(235,240,245,.30)";
  ctx.fillText("●  RUNNING  particle_solver.py",x,H-22);
  ctx.restore();
}

function draw(t){
  ctx.clearRect(0,0,W,H);
  const grad=ctx.createRadialGradient(W*.72,H*.48,0,W*.72,H*.48,Math.max(W,H)*.7);
  grad.addColorStop(0,"rgba(255,245,250,.035)");grad.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  drawCode(t);

  // 5 second seamless rotation
  const ang=(t/5)*TAU*.055;
  wireframe(ang,t);

  const arr=[];
  for(const p of pts){
    let x=p.x,y=p.y,z=p.z;
    const drift=Math.sin(t*TAU/5+p.phase)*.004;
    x+=drift + (p.vx||0)*t;
    y+=Math.cos(t*1.7+p.phase)*.003 + (p.vy||0)*t;
    z+=(p.vz||0)*t;
    const pr=project(x,y,z,ang);
    let a=p.alpha*(.72+.28*Math.sin(t*TAU/5+p.phase));
    // edges become slightly more evasive / dusty
    const edge=Math.min(1,Math.hypot(x,y)/.48);
    a*=.72+.28*edge;
    arr.push({p,pr,a});
  }
  arr.sort((a,b)=>a.pr.z-b.pr.z);
  for(const o of arr){
    const {pr,p,a}=o;
    const r=Math.max(.35,p.size*pr.s*.72);
    ctx.beginPath();ctx.arc(pr.x,pr.y,r,0,TAU);
    ctx.fillStyle=`rgba(246,239,244,${Math.max(.025,a)})`;ctx.fill();
    if(r>1.05 && a>.18){
      ctx.beginPath();ctx.moveTo(pr.x-r*1.8,pr.y);ctx.lineTo(pr.x+r*1.8,pr.y);
      ctx.strokeStyle=`rgba(245,240,245,${a*.10})`;ctx.lineWidth=.45;ctx.stroke();
    }
  }

  // subtle drifting dust halo
  for(let i=0;i<55;i++){
    const a=i*2.399+t*.25, rr=.48+.12*Math.sin(i*1.7);
    const pr=project(Math.cos(a)*rr,Math.sin(a)*rr*.65,Math.sin(a*1.7)*.16,ang);
    ctx.fillStyle=`rgba(250,245,248,${.025+.02*Math.sin(i+t)})`;
    ctx.fillRect(pr.x,pr.y,1,1);
  }

  requestAnimationFrame(()=>draw((performance.now()%5000)/1000));
}
draw(0);
})();
</script>
</body>
</html>
